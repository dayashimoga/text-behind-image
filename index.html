<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Text Behind Image | QuickUtils</title>
    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Text Behind Image",
    "url": "https://textbehind.quickutils.top/",
    "description": "Create stunning text-behind-subject effects. Upload a photo and place text that appears behind the subject.",
    "applicationCategory": "BrowserApplication",
    "operatingSystem": "All",
    "offers": {
        "@type": "Offer",
        "price": "0.00",
        "priceCurrency": "USD"
    }
}
</script>
    <link rel="canonical" href="https://textbehind.quickutils.top/">
    <meta name="keywords" content="QuickUtils, text, behind, image, code, design, productivity, online tools">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="Text Behind Image | QuickUtils">
    <meta property="og:description" content="Create stunning text-behind-subject effects. Upload a photo and place text that appears behind the subject.">
    <meta property="og:url" content="https://quickutils.top/text-behind-image/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="Create stunning text-behind-subject effects. Upload a photo and place text that appears behind the subject.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
    <link rel="stylesheet" href="quickutils-core.css">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#ffffff">
</head>
<body class="grid-bg">
    <nav class="navbar glass-nav"><div class="container nav-inner">
        <a href="https://quickutils.top" class="brand holo-text">✨ Text Behind Image</a>
        <div class="nav-links">
            <a href="https://ko-fi.com/dayatin" target="_blank" class="kofi-link">☕ Support</a>
            <button id="themeBtn" class="theme-btn">🌙</button>
        </div>
    </div></nav>
    <main class="container py-4">
        <div class="hero-section text-center mb-4"><h1 class="gradient-text">Text Behind Image</h1><p class="text-muted">Create professional text-behind-subject effects with interactive masking</p></div>
    <div class="editor-layout">
        <div class="glass-card editor-canvas-panel">
            <canvas id="effectCanvas" width="800" height="500" style="width:100%;background:#111;border-radius:12px;cursor:move;"></canvas>
            <div id="maskStatus" class="text-muted" style="font-size:0.8rem;margin-top:0.5rem;text-align:center;"></div>
        </div>
        <div class="glass-card editor-controls">
            <h3>📷 Image</h3>
            <input type="file" id="imgUpload" accept="image/*" style="display:none;">
            <button class="btn btn-primary w-100" id="uploadImg">📁 Upload Image</button>

            <h3 class="mt-3">✏️ Text</h3>
            <input type="text" id="behindText" class="form-control w-100" placeholder="Your text..." value="HELLO">
            <div class="control-row mt-2">
                <label>Color</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>
            <div class="control-row">
                <label>Size</label>
                <input type="range" id="textSize" min="20" max="300" value="100" style="flex:1;">
            </div>
            <div class="control-row">
                <label>Font</label>
                <select id="fontFamily" class="form-select">
                    <option value="Impact">Impact</option>
                    <option value="Arial Black">Arial Black</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Trebuchet MS">Trebuchet MS</option>
                    <option value="Verdana">Verdana</option>
                </select>
            </div>
            <div class="control-row">
                <label>Effect</label>
                <select id="textEffect" class="form-select">
                    <option value="solid">Solid Fill</option>
                    <option value="gradient">Gradient</option>
                    <option value="outline">Outline</option>
                    <option value="glow">Glow</option>
                    <option value="shadow">Drop Shadow</option>
                </select>
            </div>
            <div class="control-row">
                <label>Rotation</label>
                <input type="range" id="textRotation" min="-45" max="45" value="0" style="flex:1;">
            </div>

            <h3 class="mt-3">🎯 Masking</h3>
            <div class="tool-modes">
                <label class="tool-radio"><input type="radio" name="toolMode" value="drag" checked> 🖐️ Drag Text</label>
                <label class="tool-radio"><input type="radio" name="toolMode" value="paint"> 🖌️ Paint Mask</label>
                <label class="tool-radio"><input type="radio" name="toolMode" value="erase"> 🧹 Erase Mask</label>
            </div>
            <button class="btn btn-secondary w-100 mt-2" id="autoDetect">⚡ Auto-Detect Subject</button>
            <div class="control-row mt-2">
                <label>Threshold</label>
                <input type="range" id="threshold" min="50" max="220" value="128" style="flex:1;">
                <span id="thresholdVal" style="font-size:0.8rem;width:30px;text-align:right;">128</span>
            </div>
            <div class="control-row">
                <label>Brush</label>
                <input type="range" id="brushSize" min="5" max="80" value="30" style="flex:1;">
                <span id="brushSizeVal" style="font-size:0.8rem;width:40px;text-align:right;">30px</span>
            </div>
            <div class="control-row">
                <label>Opacity</label>
                <input type="range" id="maskOpacity" min="0" max="1" step="0.05" value="1" style="flex:1;">
            </div>
            <div class="d-flex gap-2 mt-2">
                <button class="btn btn-sm btn-secondary" id="undoMask" style="flex:1;">↩ Undo</button>
                <button class="btn btn-sm btn-secondary" id="clearMask" style="flex:1;">🗑️ Clear Mask</button>
            </div>

            <h3 class="mt-3">💾 Export</h3>
            <div class="d-flex gap-2">
                <button class="btn btn-primary btn-sm" id="savePNG" style="flex:1;">PNG</button>
                <button class="btn btn-secondary btn-sm" id="saveJPG" style="flex:1;">JPEG</button>
            </div>
            <div class="control-row mt-1">
                <label>Quality</label>
                <input type="range" id="jpgQuality" min="50" max="100" value="90" style="flex:1;">
            </div>
        </div>
    </div>
    </main>
    <footer class="footer"><div class="container copyright text-center py-4">© 2026 QuickUtils. All rights reserved.</div></footer>
    <script src="quickutils-core.js"></script>
    <script src="script.js"></script>

</body>
</html>
